if(day<localDay(new Date(now)))return 'Não é possível agendar aulas em datas anteriores a hoje.';
if(blockedDate(day))return 'Esta data está bloqueada pela professora. Escolha outro dia.';
if(hour<'08:00'||hour>'18:00')return 'As aulas só podem começar entre 08:00 e 18:00. Para outro horário, entre em contato com a professora.';
if(start-now<61*60*1000)return 'Agende com pelo menos 1 hora e 1 minuto de antecedência.';
if(blockedHour(day,hour))return 'Este horário coincide com um período bloqueado pela professora. Escolha outro horário.';
if(state.lessons.some(x=>x.id!==replacementId&&x.date===day&&!['cancelada','reposição'].includes(x.status)&&Math.abs(new Date(x.date+'T'+x.time).getTime()-start)<3600000))return 'Já existe uma aula neste período. Escolha outro horário.';
return ''}

function blockDay(day){manageBlockedDates();$('#form [name=date]').value=day}
function contactTeacher(){state.teacher=state.teacher||{};openForm('<h2>Solicitar outro horário</h2><p>Horários fora das 08h às 18h precisam ser combinados com a Alessandra. A solicitação abre uma mensagem no WhatsApp e não reserva uma aula.</p>'+(!whatsappNumber(state.teacher.phone)?'<p class="contact-warning">Cadastre primeiro o WhatsApp da professora em “Perfil da professora”, no menu lateral.</p>':'')+'<label>Nome do aluno</label><input name="studentName" maxlength="100" required><label>Data desejada</label><input name="date" type="date" min="'+today()+'" required><label>Horário desejado</label><input name="time" type="time" required><label>Mensagem para a professora</label><textarea name="message" rows="3"></textarea>',f=>{const number=whatsappNumber(state.teacher.phone);if(!number){alert('Cadastre o WhatsApp da professora no perfil antes de enviar a solicitação.');return false}if(f.get('date')<today()){alert('Selecione hoje ou uma data futura.');return false}const message='Olá, professora Alessandra! Gostaria de consultar a possibilidade de uma aula para '+f.get('studentName')+' no dia '+date(f.get('date'))+', às '+f.get('time')+'.'+(f.get('message')?'\n\n'+f.get('message'):'')+'\n\nAguardo sua confirmação de disponibilidade.';window.open('https://wa.me/'+number+'?text='+encodeURIComponent(message),'_blank','noopener,noreferrer')});$('#form .actions button').textContent='Abrir WhatsApp'}
function agendaBody(){let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7)+weekOffset*7);const days=Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(d.getDate()+i);return localDay(x)}),all=state.lessons.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return '<div class="actions" style="margin:0 0 20px"><button class="secondary" onclick="weekOffset--;render()">← Anterior</button><button class="secondary" onclick="weekOffset=0;render()">Hoje</button><button class="secondary" onclick="weekOffset++;render()">Próxima →</button><button class="secondary" onclick="manageBlockedDates()">Bloquear data</button><button class="secondary" onclick="manageBlockedHours()">Bloquear horário</button></div><p>'+date(days[0])+' a '+date(days[6])+' · Início das aulas: 08:00 a 18:00 · Antecedência mínima: 1h01.</p><div class="week" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">'+days.map(day=>{const blocked=blockedDate(day),past=day<today();return '<div class="day '+(blocked?'blocked-day':'')+'"><b>'+new Date(day+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'numeric'})+'</b>'+(blocked?'<p class="contact-warning">Dia bloqueado</p>':'')+(!past?'<button class="day-block" onclick="'+(blocked?'unblockDate':'blockDay')+'(\''+day+'\')">'+(blocked?'Desbloquear dia':'Bloquear dia')+'</button>':'')+(!past?'<button class="day-block" aria-label="Bloquear horário de '+date(day)+'" onclick="manageBlockedHours(\''+day+'\')">Bloquear horário</button>':'')+dayHourBlocks(day)+Array.from({length:11},(_,i)=>{const hour=String(i+8).padStart(2,'0')+':00',l=all.find(l=>l.date===day&&!['cancelada','reposição'].includes(l.status)&&Math.abs(new Date(l.date+'T'+l.time)-new Date(day+'T'+hour))<3600000);if(l)return '<div class="slot booked">'+esc(l.time)+'<br><b>'+esc(student(l.student)?.name)+'</b><br>'+esc(l.status)+'</div>';const error=bookingError(day,hour),timeBlocked=blockedHour(day,hour);return '<button class="slot '+(timeBlocked?'slot-blocked-time':'')+'" '+(error?'disabled title="'+esc(error)+'"':'onclick="addLesson(\''+day+'\',\''+hour+'\')"')+'>'+hour+' · '+(blocked||timeBlocked?'Bloqueado':past?'Encerrado':error?'Indisponível':'Livre +')+'</button>'}).join('')+'</div>'}).join('')+'</div><section class="panel" style="margin-top:24px"><h2>Precisa de outro horário?</h2><p>Para combinar uma aula fora das 08h às 18h, consulte a disponibilidade da professora.</p><button class="whatsapp" onclick="contactTeacher()">Entrar em contato com a professora</button></section><section class="panel" style="margin-top:24px"><h2>Aulas da semana</h2>'+(all.filter(l=>l.date>=days[0]&&l.date<=days[6]).map(lessonRow).join('')||'<p>Nenhuma aula nesta semana.</p>')+'</section>'}
render();

function timeMinutes(time){const parts=String(time).match(/^(\d{2}):(\d{2})$/);if(!parts||Number(parts[1])>23||Number(parts[2])>59)return NaN;return Number(parts[1])*60+Number(parts[2])}
function blockedHour(day,time){const start=timeMinutes(time);return (state.blockedHours||[]).find(b=>b.date===day&&start<timeMinutes(b.end)&&start+60>timeMinutes(b.start))}
function manageBlockedHours(day=''){
const blocks=(state.blockedHours||[]).slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
openForm('<h2>Bloquear horário</h2><p>Reserve um período para compromissos da professora. Nenhuma nova aula poderá coincidir, mesmo parcialmente, com esse intervalo.</p><label>Data</label><input name="date" type="date" min="'+today()+'" value="'+(day||today())+'" required><label>Início do bloqueio</label><input name="start" type="time" value="10:00" required><label>Fim do bloqueio</label><input name="end" type="time" value="11:00" required><label>Motivo (opcional)</label><input name="reason" maxlength="150" placeholder="Ex.: consulta, reunião ou saída"><p class="muted">Aulas já agendadas serão preservadas. Se houver conflito, combine a remarcação ou o cancelamento com o responsável.</p><h3>Períodos bloqueados</h3>'+(blocks.map(b=>{const conflicts=state.lessons.filter(l=>l.date===b.date&&l.status==='agendada'&&timeMinutes(l.time)<timeMinutes(b.end)&&timeMinutes(l.time)+60>timeMinutes(b.start)).length;return '<div class="row"><div class="grow"><b>'+date(b.date)+' · '+esc(b.start)+' às '+esc(b.end)+'</b><div class="muted">'+esc(b.reason||'Indisponível')+'</div>'+(conflicts?'<div class="contact-warning">'+conflicts+' aula(s) agendada(s) neste período: verifique a remarcação.</div>':'')+'</div><button type="button" class="secondary" onclick="unblockHour(\''+b.id+'\')">Desbloquear horário</button></div>'}).join('')||'<p>Nenhum horário bloqueado.</p>'),f=>{
const day=f.get('date'),start=f.get('start'),end=f.get('end'),a=timeMinutes(start),b=timeMinutes(end);
if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||day<today()){alert('Selecione hoje ou uma data futura.');return false}
if(!Number.isFinite(a)||!Number.isFinite(b)||a>=b){alert('O fim do bloqueio deve ser depois do início, no mesmo dia.');return false}
if((state.blockedHours||[]).some(x=>x.date===day&&a<timeMinutes(x.end)&&b>timeMinutes(x.start))){alert('Já existe um bloqueio neste intervalo. Remova o anterior para alterar o período.');return false}
state.blockedHours=state.blockedHours||[];state.blockedHours.push({id:uid(),date:day,start,end,reason:f.get('reason')});save()
});$('#form .actions button').textContent='Bloquear horário'
}
function unblockHour(id){state.blockedHours=(state.blockedHours||[]).filter(b=>b.id!==id);save();$('#modal').close();manageBlockedHours()}
function dayHourBlocks(day){return (state.blockedHours||[]).filter(b=>b.date===day).sort((a,b)=>a.start.localeCompare(b.start)).map(b=>'<div class="hour-block-note" title="'+esc(b.reason||'Indisponível')+'">⊘ '+esc(b.start)+'–'+esc(b.end)+'<button class="unblock-inline" aria-label="Desbloquear '+esc(b.start)+' às '+esc(b.end)+' de '+date(day)+'" onclick="unblockHour(\''+b.id+'\')">Desbloquear</button></div>').join('')}
render();
</script></html>
