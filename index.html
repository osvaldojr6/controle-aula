const KEY='alessandra-aulas-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}state=state||{students:[],lessons:[]};let page='Início',weekOffset=0;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID(),date=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR'),today=()=>{let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)},student=id=>state.students.find(s=>s.id===id),used=id=>state.lessons.filter(l=>l.student===id&&['realizada','falta'].includes(l.status)).length,reserved=id=>state.lessons.filter(l=>l.student===id&&l.status==='agendada').length,balance=id=>Number(student(id)?.credits||0)-used(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Não foi possível salvar. Exporte um backup antes de fechar.')}render()}function go(p){page=p;render()}function openForm(html,fn){$('#form').innerHTML=html+'<div class="actions"><button>Salvar</button><button type="button" class="secondary" onclick="document.querySelector(\'dialog\').close()">Cancelar</button></div>';$('#form').onsubmit=e=>{e.preventDefault();if(fn(new FormData(e.target))!==false)$('#modal').close()};$('#modal').showModal()}
function addStudent(){openForm('<h2>Novo aluno</h2><label>Nome da criança</label><input name="name" required maxlength="100"><label>Idade / ano escolar</label><input name="grade" maxlength="60"><label>Nome do responsável</label><input name="guardian" required maxlength="100"><label>Telefone do responsável</label><input name="phone" type="tel"><label>Horas contratadas</label><input name="credits" type="number" min="0" max="10000" step="1" value="0" required><label>Observações pedagógicas</label><textarea name="notes"></textarea>',f=>{state.students.push({id:uid(),...Object.fromEntries(f),credits:Number(f.get('credits'))});save()})}
function addLesson(day='',hour='14:00',replacementId=null){
if(!state.students.length){alert('Cadastre um aluno para agendar sua primeira aula.');addStudent();return}
if(day&&day<today()){alert('Não é possível agendar aulas em datas anteriores a hoje.');return}
if(day&&blockedDate(day)){alert('Esta data está bloqueada pela professora. Escolha outro dia.');return}
let chosen=day||today();if(!day&&bookingError(chosen,hour,replacementId)){let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+1);chosen=localDay(d);while(blockedDate(chosen)){d.setDate(d.getDate()+1);chosen=localDay(d)}}
const original=replacementId&&state.lessons.find(l=>l.id===replacementId);
openForm('<h2>Agendar uma aula · 1 hora</h2><p>Início entre 08:00 e 18:00, com pelo menos 1 hora e 1 minuto de antecedência.</p><label>Aluno</label><select name="student">'+state.students.map(s=>'<option value="'+s.id+'" '+(original?.student===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select><label>Data</label><input name="date" type="date" min="'+today()+'" value="'+chosen+'" oninput="bookingDateChanged(this)" required><label>Horário de início</label><input name="time" type="time" min="08:00" max="18:00" step="60" value="'+hour+'" required><p id="bookingDateError" role="status" class="muted"></p><label>Conteúdo / objetivo</label><textarea name="notes">'+esc(original?.notes||'')+'</textarea><button type="button" class="secondary" onclick="contactTeacher()">Solicitar horário diferente à professora</button>',f=>{
let l=Object.fromEntries(f),error=bookingError(l.date,l.time,replacementId);if(error){alert(error);return false}
if(!student(l.student)){alert('Selecione um aluno cadastrado.');return false}
if(balance(l.student)-reserved(l.student)<1){alert('Este aluno não tem horas livres. Adicione horas ao pacote primeiro.');return false}
state.lessons.push({id:uid(),...l,status:'agendada'});if(original)original.status='cancelada';save()
})}

function status(id,value){let l=state.lessons.find(x=>x.id===id);if(value==='realizada'&&new Date(l.date+'T'+l.time)>new Date()){alert('A aula ainda não começou.');return}l.status=value;save()}function credits(id){openForm('<h2>Adicionar horas</h2><p>'+esc(student(id).name)+'</p><label>Quantidade de horas</label><input name="hours" type="number" min="1" max="10000" step="1" required>',f=>{student(id).credits+=Number(f.get('hours'));save()})}function detail(id){let s=student(id);openForm('<h2>'+esc(s.name)+'</h2><p>'+esc(s.grade)+' · Responsável: '+esc(s.guardian)+'<br>'+esc(s.phone)+'</p><label>Anotações pedagógicas</label><textarea name="notes">'+esc(s.notes)+'</textarea><h3>Histórico</h3>'+state.lessons.filter(l=>l.student===id).sort((a,b)=>b.date.localeCompare(a.date)).map(l=>'<p>'+date(l.date)+' · '+l.time+' · '+esc(l.status)+'<br>'+esc(l.notes)+'</p>').join(''),f=>{s.notes=f.get('notes');save()})}

function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='alessandra-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function restore(input){let f=input.files[0];if(!f)return;f.text().then(t=>{try{let x=JSON.parse(t);if(!Array.isArray(x.students)||!Array.isArray(x.lessons)||!x.students.every(s=>typeof s.id==='string'&&typeof s.name==='string'&&Number.isInteger(s.credits)&&s.credits>=0)||!x.lessons.every(l=>typeof l.id==='string'&&x.students.some(s=>s.id===l.student)&&/^\d{4}-\d{2}-\d{2}$/.test(l.date)&&/^\d{2}:\d{2}$/.test(l.time)&&['agendada','realizada','falta','cancelada','reposição'].includes(l.status)))throw Error();if(confirm('Substituir os dados atuais pelo backup?')){state=x;save()}}catch{alert('Arquivo de backup inválido.')}})}

function photo(data,name,size=48){return validPhoto(data)?'<img class="portrait" width="'+size+'" height="'+size+'" src="'+data+'" alt="Foto de '+esc(name)+'">':'<span class="portrait placeholder" style="width:'+size+'px;height:'+size+'px">'+esc(name.slice(0,1))+'</span>'}
function validPhoto(data){return typeof data==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(data)}
async function setPhoto(input,id){const file=input.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>15*1024*1024){alert('Escolha uma foto JPG, PNG ou WebP de até 15 MB.');return}try{const img=await createImageBitmap(file),canvas=document.createElement('canvas');const scale=Math.min(1,400/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);img.close();const target=id==='teacher'?state.teacher:student(id);target.photo=canvas.toDataURL('image/jpeg',.8);save();const preview=$('#photoPreview');if(preview)preview.innerHTML=photo(target.photo,id==='teacher'?'Alessandra Saliba':target.name,90)}catch{alert('Não foi possível abrir esta imagem. Tente outra foto.')}}

function elapsed(timer,now=Date.now()){return (timer.elapsed||0)+(timer.running?Math.max(0,now-timer.started):0)}

function startTimer(id){const l=state.lessons.find(x=>x.id===id);if(new Date(l.date+'T'+l.time)>new Date()){alert('O cronômetro poderá ser iniciado no horário da aula.');return}if(state.timer&&state.timer.lesson!==id&&state.timer.running){alert('Pause ou finalize o cronômetro atual antes de iniciar outra aula.');return}if(!state.timer||state.timer.lesson!==id)state.timer={lesson:id,elapsed:0,running:false};if(!state.timer.running){state.timer.started=Date.now();state.timer.running=true}enableSound();save()}

function tick(){let now=Date.now();const scheduled=state.lessons.filter(l=>l.status==='agendada').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const next=scheduled.find(l=>new Date(l.date+'T'+l.time).getTime()>now);const current=scheduled.find(l=>{let t=new Date(l.date+'T'+l.time).getTime();return t<=now&&now<t+3600000});let counter=$('#nextCounter');if(counter){counter.textContent=next?timeText(new Date(next.date+'T'+next.time)-now):'—';$('#nextLabel').textContent=next?student(next.student)?.name+' · '+date(next.date)+' às '+next.time:'Nenhuma próxima aula agendada';$('#currentLabel').textContent=current?'Agora: aula de '+student(current.student)?.name+' · '+current.time:''}
if(state.alertEnabled)for(const l of scheduled){let start=new Date(l.date+'T'+l.time).getTime(),delta=start-now,key=l.id+':'+l.date+':'+l.time;if(delta>0&&delta<=300000)notifyLesson(key+':5','A aula de '+student(l.student)?.name+' começa em menos de 5 minutos, às '+l.time+'.');if(delta<=0&&delta>-60000)notifyLesson(key+':0','Está na hora da aula de '+student(l.student)?.name+'!')}

detail=function(id){detailBeforeWhatsApp(id);$('#form .actions').insertAdjacentHTML('beforebegin','<label>WhatsApp do responsável</label><input type="tel" name="phone" value="'+esc(student(id).phone)+'" placeholder="DDD e número">');const previous=$('#form').onsubmit;$('#form').onsubmit=e=>{const value=new FormData(e.target).get('phone');if(value&&!whatsappNumber(value)){e.preventDefault();alert('Confira o telefone do responsável.');return}student(id).phone=value;previous(e)}};

// Controle financeiro por hora: valores em centavos e recebimentos separados.
state.payments=state.payments||[];
const money=n=>(Number(n||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function cents(value){return Math.round(Number(String(value).replace(',','.'))*100)}
const billable=l=>['realizada','falta'].includes(l.status);
function lessonPrice(l){return Number.isInteger(l.rateCents)?l.rateCents:null}
function financeTotals(id){const lessons=state.lessons.filter(l=>billable(l)&&(!id||l.student===id)),payments=(state.payments||[]).filter(p=>!id||p.student===id);const charged=lessons.reduce((sum,l)=>sum+(lessonPrice(l)||0),0),paid=payments.reduce((sum,p)=>sum+p.cents,0);return {charged,paid,pending:Math.max(0,charged-paid),credit:Math.max(0,paid-charged),unpriced:lessons.filter(l=>lessonPrice(l)===null).length}}
function configureRate(id){const s=student(id);openForm('<h2>Valor da hora-aula</h2><p>'+esc(s.name)+'</p><label>Preço por aula de 1 hora (R$)</label><input name="rate" type="number" min="0" max="100000" step="0.01" required value="'+(s.hourRateCents===undefined?'':s.hourRateCents/100)+'"><label><input name="apply" type="checkbox" style="width:auto"> Aplicar também às aulas já cobradas que estão sem preço</label><p class="muted">A alteração será usada nas próximas conclusões. Valores já registrados em aulas anteriores serão preservados.</p>',f=>{s.hourRateCents=cents(f.get('rate'));if(f.get('apply'))state.lessons.filter(l=>l.student===id&&billable(l)&&lessonPrice(l)===null).forEach(l=>l.rateCents=s.hourRateCents);save()})}
function priceLesson(id){const l=state.lessons.find(x=>x.id===id);openForm('<h2>Valor desta aula</h2><p>'+esc(student(l.student)?.name)+' · '+date(l.date)+' · '+esc(l.time)+'</p><label>Valor de 1 hora (R$)</label><input name="rate" type="number" min="0" max="100000" step="0.01" required value="'+(lessonPrice(l)===null?'':l.rateCents/100)+'">',f=>{l.rateCents=cents(f.get('rate'));save()})}
function addPayment(id){if(!state.students.length){alert('Cadastre um aluno primeiro.');return}openForm('<h2>Registrar recebimento</h2><label>Aluno</label><select name="student">'+state.students.map(s=>'<option '+(s.id===id?'selected ':'')+'value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select><label>Valor recebido (R$)</label><input name="value" type="number" min="0.01" max="10000000" step="0.01" required><label>Data do pagamento</label><input type="date" name="date" value="'+today()+'" required><label>Forma de pagamento</label><select name="method"><option>Pix</option><option>Dinheiro</option><option>Transferência</option><option>Cartão</option><option>Outro</option></select><label>Observação</label><textarea name="note" placeholder="Ex.: adiantamento de pacote de 8 horas"></textarea>',f=>{state.payments=state.payments||[];state.payments.push({id:uid(),student:f.get('student'),cents:cents(f.get('value')),date:f.get('date'),method:f.get('method'),note:f.get('note')});save()})}
function removePayment(id){if(confirm('Excluir este recebimento registrado?')){state.payments=state.payments.filter(p=>p.id!==id);save()}}
function capturePrice(l){const s=student(l.student);if(billable(l)&&lessonPrice(l)===null&&Number.isInteger(s?.hourRateCents))l.rateCents=s.hourRateCents}
const statusBeforeFinance=status;status=function(id,value){statusBeforeFinance(id,value);capturePrice(state.lessons.find(x=>x.id===id));save()};
const finishBeforeFinance=finishTimer;finishTimer=function(){const id=state.timer?.lesson;finishBeforeFinance();if(id&&!state.timer){capturePrice(state.lessons.find(x=>x.id===id));save()}};
const detailBeforeFinance=detail;detail=function(id){detailBeforeFinance(id);$('#form .actions').insertAdjacentHTML('beforebegin','<p><b>Valor por hora:</b> '+(Number.isInteger(student(id).hourRateCents)?money(student(id).hourRateCents):'Não definido')+'</p><button type="button" class="secondary" onclick="configureRate(\''+id+'\')">Definir valor da hora</button>')};
let financeStudent='';
function financePage(){const t=financeTotals(financeStudent),lessons=state.lessons.filter(l=>billable(l)&&(!financeStudent||l.student===financeStudent)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)),payments=(state.payments||[]).filter(p=>!financeStudent||p.student===financeStudent).sort((a,b)=>b.date.localeCompare(a.date));return '<header><div><div class="eyebrow">MEU CADERNO DE AULAS</div><h1>Financeiro</h1></div><button onclick="addPayment(financeStudent)">+ Recebimento</button></header><label>Consultar aluno</label><select style="max-width:400px;margin-bottom:20px" onchange="financeStudent=this.value;render()"><option value="">Todos os alunos</option>'+state.students.map(s=>'<option value="'+s.id+'" '+(s.id===financeStudent?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select><div class="cards">'+[['Aulas cobradas',money(t.charged),'Aulas realizadas e faltas com desconto'],['Recebido',money(t.paid),'Pagamentos registrados'],['Saldo a receber',money(t.pending),'Após descontar recebimentos'],['Crédito antecipado',money(t.credit),'Valor disponível para próximas aulas']].map(c=>'<div class="card">'+c[0]+'<strong style="font-size:25px">'+c[1]+'</strong><small>'+c[2]+'</small></div>').join('')+'</div>'+(t.unpriced?'<div class="panel">'+t.unpriced+' aula(s) sem preço. Defina os valores para completar os totais.</div>':'')+'<p>Os valores consideram todo o histórico. Cada aula equivale a 1 hora. Adiantamentos ficam como crédito e são compensados pelas aulas cobradas. O saldo é calculado separadamente para cada aluno.</p><section class="panel"><h2>Valor da hora por aluno</h2>'+state.students.filter(s=>!financeStudent||s.id===financeStudent).map(s=>{const x=financeTotals(s.id);return '<div class="row"><div class="grow"><b>'+esc(s.name)+'</b><div class="muted">Hora-aula: '+(Number.isInteger(s.hourRateCents)?money(s.hourRateCents):'Não definido')+' · A receber: '+money(x.pending)+' · Crédito: '+money(x.credit)+'</div></div><button class="secondary" onclick="configureRate(\''+s.id+'\')">Valor da hora</button><button onclick="addPayment(\''+s.id+'\')">Recebimento</button></div>'}).join('')+'</section><section class="panel" style="margin-top:24px"><h2>Detalhamento por hora-aula</h2><div style="overflow:auto"><table><tr><th>ALUNO</th><th>AULA</th><th>SITUAÇÃO</th><th>HORAS</th><th>VALOR</th><th></th></tr>'+lessons.map(l=>'<tr><td>'+esc(student(l.student)?.name)+'</td><td>'+date(l.date)+' · '+esc(l.time)+'</td><td>'+esc(l.status)+'</td><td>1h</td><td>'+(lessonPrice(l)===null?'Sem preço':money(l.rateCents))+'</td><td><button class="secondary" onclick="priceLesson(\''+l.id+'\')">Ajustar valor</button></td></tr>').join('')+'</table></div>'+(lessons.length?'':'<p>Nenhuma aula cobrada ainda.</p>')+'</section><section class="panel" style="margin-top:24px"><h2>Recebimentos</h2>'+payments.map(p=>'<div class="row"><div class="grow"><b>'+esc(student(p.student)?.name)+' · '+money(p.cents)+'</b><div class="muted">'+date(p.date)+' · '+esc(p.method)+' · '+esc(p.note)+'</div></div><button class="danger" onclick="removePayment(\''+p.id+'\')">Excluir</button></div>').join('')+(payments.length?'':'<p>Nenhum recebimento registrado.</p>')+'</section>'}
const renderBeforeFinance=render;render=function(){renderBeforeFinance();$('#nav').insertAdjacentHTML('beforeend','<button class="'+(page==='Financeiro'?'active':'')+'" onclick="go(\'Financeiro\')">$ &nbsp; Financeiro</button>');if(page==='Financeiro')$('#app').innerHTML='<div id="notice" role="alert" hidden></div>'+financePage()};
// Na visão geral, créditos de um aluno não abatem dívidas de outro.
const individualFinanceTotals=financeTotals;financeTotals=function(id){if(id)return individualFinanceTotals(id);const total={charged:0,paid:0,pending:0,credit:0,unpriced:0};state.students.forEach(s=>{const x=individualFinanceTotals(s.id);for(const k of Object.keys(total))total[k]+=x[k]});return total};
render();

function localDay(d){return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function blockedDate(day){return (state.blockedDates||[]).find(x=>x.date===day)}
function bookingError(day,hour,replacementId=null,now=Date.now()){
if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||!/^\d{2}:\d{2}$/.test(hour))return 'Informe uma data e um horário válidos.';
const start=new Date(day+'T'+hour).getTime();if(!Number.isFinite(start))return 'Informe uma data e um horário válidos.';
if(day<localDay(new Date(now)))return 'Não é possível agendar aulas em datas anteriores a hoje.';
if(blockedDate(day))return 'Esta data está bloqueada pela professora. Escolha outro dia.';
if(hour<'08:00'||hour>'18:00')return 'As aulas só podem começar entre 08:00 e 18:00. Para outro horário, entre em contato com a professora.';
if(start-now<61*60*1000)return 'Agende com pelo menos 1 hora e 1 minuto de antecedência.';
if(blockedHour(day,hour))return 'Este horário coincide com um período bloqueado pela professora. Escolha outro horário.';
if(state.lessons.some(x=>x.id!==replacementId&&x.date===day&&!['cancelada','reposição'].includes(x.status)&&Math.abs(new Date(x.date+'T'+x.time).getTime()-start)<3600000))return 'Já existe uma aula neste período. Escolha outro horário.';
return ''}
function bookingDateChanged(input){input.min=today();const message=$('#bookingDateError');if(input.value&&(input.value<today()||blockedDate(input.value))){if(message)message.textContent=blockedDate(input.value)?'Dia bloqueado pela professora. Selecione outra data.':'Selecione hoje ou uma data futura.';input.value=''}else if(message)message.textContent=''}
function manageBlockedDates(){openForm('<h2>Bloquear uma data</h2><p>Reserve o dia inteiro quando precisar sair. Aulas já agendadas são preservadas e devem ser remarcadas ou canceladas separadamente.</p><label>Data indisponível</label><input name="date" type="date" min="'+today()+'" required><label>Motivo (opcional)</label><input name="reason" maxlength="150" placeholder="Ex.: compromisso da professora"><h3>Dias bloqueados</h3>'+((state.blockedDates||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)).map(b=>'<div class="row"><div class="grow"><b>'+date(b.date)+'</b><div class="muted">'+esc(b.reason||'Indisponível')+'</div></div><button type="button" class="secondary" onclick="unblockDate(\''+b.date+'\')">Desbloquear</button></div>').join('')||'<p>Nenhuma data bloqueada.</p>'),f=>{const day=f.get('date');if(!day||day<today()){alert('Selecione hoje ou uma data futura.');return false}if(blockedDate(day)){alert('Esta data já está bloqueada.');return false}state.blockedDates=state.blockedDates||[];state.blockedDates.push({date:day,reason:f.get('reason')});save()})}
function unblockDate(day){state.blockedDates=(state.blockedDates||[]).filter(x=>x.date!==day);save();$('#modal').close();manageBlockedDates()}
function blockDay(day){manageBlockedDates();$('#form [name=date]').value=day}
function contactTeacher(){state.teacher=state.teacher||{};openForm('<h2>Solicitar outro horário</h2><p>Horários fora das 08h às 18h precisam ser combinados com a Alessandra. A solicitação abre uma mensagem no WhatsApp e não reserva uma aula.</p>'+(!whatsappNumber(state.teacher.phone)?'<p class="contact-warning">Cadastre primeiro o WhatsApp da professora em “Perfil da professora”, no menu lateral.</p>':'')+'<label>Nome do aluno</label><input name="studentName" maxlength="100" required><label>Data desejada</label><input name="date" type="date" min="'+today()+'" required><label>Horário desejado</label><input name="time" type="time" required><label>Mensagem para a professora</label><textarea name="message" rows="3"></textarea>',f=>{const number=whatsappNumber(state.teacher.phone);if(!number){alert('Cadastre o WhatsApp da professora no perfil antes de enviar a solicitação.');return false}if(f.get('date')<today()){alert('Selecione hoje ou uma data futura.');return false}const message='Olá, professora Alessandra! Gostaria de consultar a possibilidade de uma aula para '+f.get('studentName')+' no dia '+date(f.get('date'))+', às '+f.get('time')+'.'+(f.get('message')?'\n\n'+f.get('message'):'')+'\n\nAguardo sua confirmação de disponibilidade.';window.open('https://wa.me/'+number+'?text='+encodeURIComponent(message),'_blank','noopener,noreferrer')});$('#form .actions button').textContent='Abrir WhatsApp'}
function agendaBody(){let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7)+weekOffset*7);const days=Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(d.getDate()+i);return localDay(x)}),all=state.lessons.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return '<div class="actions" style="margin:0 0 20px"><button class="secondary" onclick="weekOffset--;render()">← Anterior</button><button class="secondary" onclick="weekOffset=0;render()">Hoje</button><button class="secondary" onclick="weekOffset++;render()">Próxima →</button><button class="secondary" onclick="manageBlockedDates()">Bloquear data</button><button class="secondary" onclick="manageBlockedHours()">Bloquear horário</button></div><p>'+date(days[0])+' a '+date(days[6])+' · Início das aulas: 08:00 a 18:00 · Antecedência mínima: 1h01.</p><div class="week" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">'+days.map(day=>{const blocked=blockedDate(day),past=day<today();return '<div class="day '+(blocked?'blocked-day':'')+'"><b>'+new Date(day+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'numeric'})+'</b>'+(blocked?'<p class="contact-warning">Dia bloqueado</p>':'')+(!past?'<button class="day-block" onclick="'+(blocked?'unblockDate':'blockDay')+'(\''+day+'\')">'+(blocked?'Desbloquear dia':'Bloquear dia')+'</button>':'')+(!past?'<button class="day-block" aria-label="Bloquear horário de '+date(day)+'" onclick="manageBlockedHours(\''+day+'\')">Bloquear horário</button>':'')+dayHourBlocks(day)+Array.from({length:11},(_,i)=>{const hour=String(i+8).padStart(2,'0')+':00',l=all.find(l=>l.date===day&&!['cancelada','reposição'].includes(l.status)&&Math.abs(new Date(l.date+'T'+l.time)-new Date(day+'T'+hour))<3600000);if(l)return '<div class="slot booked">'+esc(l.time)+'<br><b>'+esc(student(l.student)?.name)+'</b><br>'+esc(l.status)+'</div>';const error=bookingError(day,hour),timeBlocked=blockedHour(day,hour);return '<button class="slot '+(timeBlocked?'slot-blocked-time':'')+'" '+(error?'disabled title="'+esc(error)+'"':'onclick="addLesson(\''+day+'\',\''+hour+'\')"')+'>'+hour+' · '+(blocked||timeBlocked?'Bloqueado':past?'Encerrado':error?'Indisponível':'Livre +')+'</button>'}).join('')+'</div>'}).join('')+'</div><section class="panel" style="margin-top:24px"><h2>Precisa de outro horário?</h2><p>Para combinar uma aula fora das 08h às 18h, consulte a disponibilidade da professora.</p><button class="whatsapp" onclick="contactTeacher()">Entrar em contato com a professora</button></section><section class="panel" style="margin-top:24px"><h2>Aulas da semana</h2>'+(all.filter(l=>l.date>=days[0]&&l.date<=days[6]).map(lessonRow).join('')||'<p>Nenhuma aula nesta semana.</p>')+'</section>'}
render();

function timeMinutes(time){const parts=String(time).match(/^(\d{2}):(\d{2})$/);if(!parts||Number(parts[1])>23||Number(parts[2])>59)return NaN;return Number(parts[1])*60+Number(parts[2])}
function blockedHour(day,time){const start=timeMinutes(time);return (state.blockedHours||[]).find(b=>b.date===day&&start<timeMinutes(b.end)&&start+60>timeMinutes(b.start))}
function manageBlockedHours(day=''){
const blocks=(state.blockedHours||[]).slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
openForm('<h2>Bloquear horário</h2><p>Reserve um período para compromissos da professora. Nenhuma nova aula poderá coincidir, mesmo parcialmente, com esse intervalo.</p><label>Data</label><input name="date" type="date" min="'+today()+'" value="'+(day||today())+'" required><label>Início do bloqueio</label><input name="start" type="time" value="10:00" required><label>Fim do bloqueio</label><input name="end" type="time" value="11:00" required><label>Motivo (opcional)</label><input name="reason" maxlength="150" placeholder="Ex.: consulta, reunião ou saída"><p class="muted">Aulas já agendadas serão preservadas. Se houver conflito, combine a remarcação ou o cancelamento com o responsável.</p><h3>Períodos bloqueados</h3>'+(blocks.map(b=>{const conflicts=state.lessons.filter(l=>l.date===b.date&&l.status==='agendada'&&timeMinutes(l.time)<timeMinutes(b.end)&&timeMinutes(l.time)+60>timeMinutes(b.start)).length;return '<div class="row"><div class="grow"><b>'+date(b.date)+' · '+esc(b.start)+' às '+esc(b.end)+'</b><div class="muted">'+esc(b.reason||'Indisponível')+'</div>'+(conflicts?'<div class="contact-warning">'+conflicts+' aula(s) agendada(s) neste período: verifique a remarcação.</div>':'')+'</div><button type="button" class="secondary" onclick="unblockHour(\''+b.id+'\')">Desbloquear horário</button></div>'}).join('')||'<p>Nenhum horário bloqueado.</p>'),f=>{
const day=f.get('date'),start=f.get('start'),end=f.get('end'),a=timeMinutes(start),b=timeMinutes(end);
if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||day<today()){alert('Selecione hoje ou uma data futura.');return false}
if(!Number.isFinite(a)||!Number.isFinite(b)||a>=b){alert('O fim do bloqueio deve ser depois do início, no mesmo dia.');return false}
if((state.blockedHours||[]).some(x=>x.date===day&&a<timeMinutes(x.end)&&b>timeMinutes(x.start))){alert('Já existe um bloqueio neste intervalo. Remova o anterior para alterar o período.');return false}
state.blockedHours=state.blockedHours||[];state.blockedHours.push({id:uid(),date:day,start,end,reason:f.get('reason')});save()
});$('#form .actions button').textContent='Bloquear horário'
}
function unblockHour(id){state.blockedHours=(state.blockedHours||[]).filter(b=>b.id!==id);save();$('#modal').close();manageBlockedHours()}
function dayHourBlocks(day){return (state.blockedHours||[]).filter(b=>b.date===day).sort((a,b)=>a.start.localeCompare(b.start)).map(b=>'<div class="hour-block-note" title="'+esc(b.reason||'Indisponível')+'">⊘ '+esc(b.start)+'–'+esc(b.end)+'<button class="unblock-inline" aria-label="Desbloquear '+esc(b.start)+' às '+esc(b.end)+' de '+date(day)+'" onclick="unblockHour(\''+b.id+'\')">Desbloquear</button></div>').join('')}
render();
</script></html>
